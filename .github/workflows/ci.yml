name: CI

# Typecheck, lint, test and build on every push to main and every pull request, with no
# permission beyond reading the repository.
#
# The publish workflow calls this same file for its build (`workflow_call`, with `pack`),
# so the tarball that reaches npm is the one checked here, and the installation scripts of
# the lock file (esbuild, isolated-vm, ssh2 and others) never run in a job that can mint
# the publication token (kopko13/sirenic#154).
#
# Actions are pinned by commit, the release in the comment beside each one.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      pack:
        description: Pack the checked tree and upload the tarball as the artifact `package`.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install exactly what the lock file says
        # `npm ci`, not `npm install`: a package.json out of step with the lock fails the run
        # instead of being resolved again and the lock rewritten.
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (official n8n-node tool, strict mode)
        # In strict mode `n8n-node lint` ALSO checks that eslint.config.mjs has
        # not been changed from the official config: that is the eligibility
        # condition for n8n Cloud publishing.
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the package declares no runtime dependencies
        # Belt and braces: `dependencies` must stay empty or the package is
        # rejected at verification. Catching it here beats catching it after a
        # publish that cannot be undone.
        run: |
          deps=$(node -p "JSON.stringify(require('./package.json').dependencies ?? {})")
          if [ "$deps" != "{}" ]; then
            echo "::error::package.json declares runtime dependencies: $deps"
            exit 1
          fi

      - name: Pack the tarball to publish
        if: inputs.pack
        run: npm pack

      - name: Hand the tarball to the publish job
        if: inputs.pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: n8n-nodes-sirenic-*.tgz
          if-no-files-found: error
          retention-days: 1
