name: Publish n8n node to npm

# The point of this workflow is provenance, and it is not a detail.
#
# Since 1 May 2026 n8n requires, verbatim: "you must publish ALL community nodes
# using a GitHub action and include a provenance statement". Both existing x402
# community nodes fail the official scanner on exactly this — "Package was not
# published with npm provenance" — which is why neither is available on n8n
# Cloud. Publishing with provenance from day one is what makes this package
# eligible.
#
# It is also the ONLY way this package may be published. 0.7.0 to 0.10.0 were
# published by hand and reached npm with no attestation at all, which the n8n
# verification review rejected; `prepublishOnly` in package.json now refuses any
# publish that does not come from GitHub Actions.
#
# AUTHENTICATION: npm trusted publishing (OIDC). There is no npm token here and
# no `NPM_TOKEN` secret to leak or rotate — npm authenticates the run itself
# from the OIDC token GitHub mints below, and only accepts it for the exact
# repository and workflow filename registered on npmjs.com. That registration is
# part of the build: rename this file and publishing stops working until the
# trusted publisher is updated to match.
#
# Trigger: push a tag shaped `v*` (e.g. v0.3.1), or run it by hand.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# (dedicated repository: the package sits at the root — no working-directory)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: mints the OIDC token attesting this
      # artifact was built from this repository, by this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install an npm that can do trusted publishing
        # Node 22 still ships npm 10.x, and OIDC publishing needs 11.5.1 or
        # later. Without this the publish fails with ENEEDAUTH — which reads
        # like a missing token and sends you looking in the wrong place, so the
        # version is asserted here rather than discovered at the publish step.
        run: |
          npm install -g npm@latest
          version=$(npm --version)
          echo "npm ${version}"
          node -e '
            const v = process.argv[1].split(".").map(Number);
            const ok = v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 1)));
            if (!ok) {
              console.error(`::error::npm ${process.argv[1]} is too old for trusted publishing (need 11.5.1 or later)`);
              process.exit(1);
            }
          ' "$version"

      - run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (official n8n-node tool, strict mode)
        # In strict mode `n8n-node lint` ALSO checks that eslint.config.mjs has
        # not been changed from the official config — that is the eligibility
        # condition for n8n Cloud publishing.
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the package declares no runtime dependencies
        # Belt and braces: `dependencies` must stay empty or the package is
        # rejected at verification. Catching it here beats catching it after a
        # publish that cannot be undone.
        run: |
          deps=$(node -p "JSON.stringify(require('./package.json').dependencies ?? {})")
          if [ "$deps" != "{}" ]; then
            echo "::error::package.json declares runtime dependencies: $deps"
            exit 1
          fi

      - name: Publish
        # No `env:` block, and that is the point: npm authenticates this run
        # through the OIDC token, against the trusted publisher registered for
        # this package on npmjs.com. A stray NODE_AUTH_TOKEN here would silently
        # win over OIDC and we would believe we had moved off tokens when we had
        # not. `--provenance` is redundant under trusted publishing (npm attests
        # automatically) but harmless, and it keeps the intent readable.
        run: npm publish --provenance --access public

      - name: Verify the registry really recorded the provenance attestation
        # `--provenance` succeeding is not proof the attestation landed: what the
        # n8n scanner reads is `dist.attestations.provenance` on the registry,
        # and that is what this asserts. Attestations show up a few seconds after
        # the publish, hence the retries.
        run: |
          version=$(node -p "require('./package.json').version")
          for attempt in 1 2 3 4 5 6; do
            type=$(npm view "n8n-nodes-sirenic@${version}" dist.attestations.provenance.predicateType 2>/dev/null || true)
            if [ "$type" = "https://slsa.dev/provenance/v1" ]; then
              echo "Provenance attestation confirmed for ${version}"
              exit 0
            fi
            echo "attempt ${attempt}: no attestation yet, waiting"
            sleep 10
          done
          echo "::error::n8n-nodes-sirenic@${version} is published but the registry reports no provenance attestation — n8n verification will reject it."
          exit 1
